// xray-core app/stats/command/command.proto 的 QueryStats 子集。
// 仅作文档：编解码在 grpc.go 手写（E-4 核心尺寸预算，不引 protoc 生成器），
// 字段号与 XTLS/Xray-core 官方定义一致。
syntax = "proto3";
package xray.app.stats.command;

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}

message Stat {
  string name = 1;
  uint64 value = 2;
  uint32 reset = 3;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}
