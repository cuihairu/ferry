# This file takes over the account-level Dependabot default config (2026-10-09 dependabot batch).
#
# npm version updates are switched off entirely: dependabot's pnpm updater does not understand
# pnpm-workspace.yaml overrides (known gaps dependabot-core#11953/#11135) — the 2026-10-09 batch first
# tried ignoring vite/esbuild, and run 37943084657 still failed (a parse-layer defect that does not go
# away with ignore, see todo.md's dependabot wrap-up decision), so as a fallback open-pull-requests-limit
# was set to 0.
# Security alerts are independent of version updates and are unaffected; once vitepress 2 stable drops
# the override, npm updates can be re-enabled.
# Supplement (2026-11-22 review, run 44959739326): npm's security-update job also goes red — it looks for
# /package.json under directory: /, and the root has no such file (a pnpm workspace root only has
# pnpm-workspace.yaml), so the updater aborts with "/package.json not found". This failure does not affect
# alerts: the scanner opens/closes them automatically based on whether the lockfile contains vulnerable
# versions, and fixes come from editing the override by hand (the vite 6.4.6 batch already wrapped up with
# 0 open alerts). That red run is the known symptom of the limitation, nothing to do.
#
# The six gomod modules keep the account default behavior: weekly + a go_modules group for everything.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /server
      - /agent
      - /packages/agentproto
      - /packages/costref
      - /packages/payment
      - /payments
    schedule:
      interval: weekly
    groups:
      go_modules:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
