# 本文件接管账号级 Dependabot 默认配置（2026-10-09 dependabot 批）。
#
# npm 版本更新整体关闭：dependabot 的 pnpm updater 不识别 pnpm-workspace.yaml
# overrides（dependabot-core#11953/#11135 已知缺口）——2026-10-09 首批先试
# ignore vite/esbuild，run 37943084657 仍失败（parse 层缺陷不随 ignore 消失，
# 见 todo.md dependabot 收口批拍板），按兜底条件改 open-pull-requests-limit: 0。
# security alerts 独立于版本更新不受影响；vitepress 2 stable 撤 override 后
# 可重开 npm 更新。
#
# gomod 六个 module 维持账号默认行为：weekly + go_modules 全量分组。
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /server
      - /agent
      - /packages/agentproto
      - /packages/costref
      - /packages/payment
      - /payments
    schedule:
      interval: weekly
    groups:
      go_modules:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
