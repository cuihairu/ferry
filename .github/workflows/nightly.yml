name: nightly
on:
  schedule:
    # Daily build: runs at 03:23 UTC (avoiding the top-of-hour peak; 11:23 Beijing) — full build + test + package.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Skip when the repo has been idle for 48 hours
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_hours=$(( (now - last_commit) / 3600 ))
          echo "last commit ${age_hours}h ago"
          if [ "$age_hours" -ge 48 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  go:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent, payments, packages/agentproto, packages/costref, packages/payment]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: build, vet and test
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  frontend:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ferry-dash, ferry-panel, ferry-docs]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        env:
          PNPM_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.dangerouslyAllowAllBuilds=true
      - name: build
        run: pnpm --filter ${{ matrix.app }} build

  compose-smoke:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    name: compose deploy smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Real docker compose build/up (both the sqlite and postgres legs), verified through the Caddy
      # front end: static hosting, history fallback and top-level-prefix reverse proxy; the build is
      # a real compile, so this runs nightly only.
      - name: compose deploy smoke (sqlite + postgres)
        run: bash deploy/compose-smoke.sh

  systemd-smoke:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    name: systemd install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.2
      # Regress agent-install.sh against a real systemd inside the container (cgroup v2 hosts need
      # privileged + host cgroupns): enable/restart real semantics, journal failure diagnostics, .prev
      # rollback and first-install failure cleanup; the pipeline's four builds run a real ferry-server
      # to verify the full registration-chain contract.
      # The script skips itself when docker is unavailable, and the runner always has docker; go feeds
      # the pipeline's four builds.
      - name: systemd install smoke
        run: bash deploy/systemd-smoke.sh

  package:
    needs: [gate, go, frontend]
    if: needs.gate.outputs.skip != 'true'
    name: package nightly artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        env:
          PNPM_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.dangerouslyAllowAllBuilds=true
      - name: tag
        run: echo "version=nightly-$(date -u +%F)" >> "$GITHUB_ENV"
      - name: build binaries
        run: make build-server build-agent build-quic
      - name: package agent
        run: make package-agent AGENT_VERSION=${{ env.version }}
      - name: upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ferry-nightly-${{ github.run_number }}
          path: |
            bin/ferry-server
            bin/ferry-agent
            bin/ferry-quic
            bin/ferry-agent_*.tar.gz*
            bin/ferry-quic_*.tar.gz*
          retention-days: 7
