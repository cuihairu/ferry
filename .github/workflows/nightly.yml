name: nightly
on:
  schedule:
    # 每日构建：UTC 03:23（避开整点高峰；北京 11:23）跑全量构建+测试+打包。
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Skip when the repo has been idle for 48 hours
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_hours=$(( (now - last_commit) / 3600 ))
          echo "last commit ${age_hours}h ago"
          if [ "$age_hours" -ge 48 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  go:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent, payments, packages/agentproto, packages/costref, packages/payment]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: build, vet and test
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  frontend:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ferry-dash, ferry-panel, ferry-docs]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        env:
          PNPM_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.dangerouslyAllowAllBuilds=true
      - name: build
        run: pnpm --filter ${{ matrix.app }} build

  compose-smoke:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    name: compose deploy smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 真 docker compose build/up（sqlite + postgres 两条腿），经 Caddy 前端
      # 验证静态托管、history 回退与顶层前缀反代；build 是真编译，只放 nightly。
      - name: compose deploy smoke (sqlite + postgres)
        run: bash deploy/compose-smoke.sh

  systemd-smoke:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    name: systemd install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
      # 容器内真 systemd（cgroup v2 宿主需 privileged + host cgroupns）回归
      # agent-install.sh：enable/restart 真语义、journal 失败诊断、.prev 回滚
      # 与首装失败清理；链路四构建真 ferry-server 验证注册链路全真契约。
      # docker 不可用时脚本自身跳过，runner 必有 docker；go 供链路四构建。
      - name: systemd install smoke
        run: bash deploy/systemd-smoke.sh

  package:
    needs: [gate, go, frontend]
    if: needs.gate.outputs.skip != 'true'
    name: package nightly artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        env:
          PNPM_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.dangerouslyAllowAllBuilds=true
      - name: tag
        run: echo "version=nightly-$(date -u +%F)" >> "$GITHUB_ENV"
      - name: build binaries
        run: make build-server build-agent build-quic
      - name: package agent
        run: make package-agent AGENT_VERSION=${{ env.version }}
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferry-nightly-${{ github.run_number }}
          path: |
            bin/ferry-server
            bin/ferry-agent
            bin/ferry-quic
            bin/ferry-agent_*.tar.gz*
            bin/ferry-quic_*.tar.gz*
          retention-days: 7
