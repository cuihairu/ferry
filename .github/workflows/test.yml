name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # codecov OIDC 免 token 上传（公开仓，无需 secret）

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent, payments, packages/agentproto, packages/costref, packages/payment]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: flag
        id: flag
        # codecov flags 不允许斜杠，packages/agentproto → packages-agentproto
        run: echo "value=$(echo '${{ matrix.module }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -coverprofile=coverage.out ./...
      - name: upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: ${{ steps.flag.outputs.value }}
          use_oidc: true
          fail_ci_if_error: false # 上传抖动不拖红门禁

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ferry-dash, ferry-panel, ferry-docs]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        env:
          PNPM_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.dangerouslyAllowAllBuilds=true
      - name: build
        run: pnpm --filter ${{ matrix.app }} build
