name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # codecov OIDC upload without a token (public repo, no secret needed)

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent, payments, packages/agentproto, packages/costref, packages/payment]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: flag
        id: flag
        # codecov flags cannot contain slashes, so packages/agentproto becomes packages-agentproto
        run: echo "value=$(echo '${{ matrix.module }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -coverprofile=coverage.out ./...
      - name: upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: ${{ steps.flag.outputs.value }}
          use_oidc: true
          fail_ci_if_error: false # an upload hiccup should not turn the gate red

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ferry-dash, ferry-panel, ferry-docs]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        env:
          PNPM_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.dangerouslyAllowAllBuilds=true
      - name: build
        run: pnpm --filter ${{ matrix.app }} build

  deploy-scripts:
    name: deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.2
      - name: install script rollback regression
        run: bash deploy/install-rollback-test.sh
      - name: start script arg assembly
        run: bash deploy/start-args-test.sh
      - name: e2e deploy smoke
        run: bash deploy/e2e-smoke.sh
      - name: server upgrade test
        run: bash deploy/upgrade-test.sh
      - name: server rollback test
        run: bash deploy/rollback-test.sh
      - name: server restart agent reconnect test
        run: bash deploy/reconnect-test.sh
      - name: data plane outage test
        run: bash deploy/dataplane-test.sh
      - name: relay path probe smoke
        run: bash deploy/relay-path-test.sh

  gofmt:
    name: gofmt gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.2
      - name: format gate
        # Format gate (codex deep review P2): any un-gofmt'ed file turns the job red, preventing drift into main.
        # The directory set matches the Makefile fmt target.
        run: |
          out=$(gofmt -l server agent packages/agentproto packages/costref packages/payment payments)
          if [ -n "$out" ]; then
            echo "::error::未 gofmt 的文件：$out"
            exit 1
          fi
