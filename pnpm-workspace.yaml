packages:
  - dash
  - panel
  - docs
  # dash=admin console (matching the design spec's wording); panel=user panel; docs=documentation site (VitePress)

# Security bump (2026-10-09 dependabot batch; re-batched 2026-11-22): vitepress 1.x pins vite ^5.4.14
# (<6.4.2 had 1 high + 2 medium, raised to 6.4.3 on 2026-10-09; dependabot in 2026-11 opened another
# 1 high + 3 medium + 1 low for <6.4.3 fixed in 6.4.4, and 1 medium for =6.4.4
# fixed in 6.4.5), so the scoped override moves to the latest patch 6.4.6; it only matches the
# vite 5 declaration, so the vite ^7 ranges in dash/panel are unaffected. vitepress 2 (vite ^8) is
# still alpha and is not upgraded.
overrides:
  "vite@^5.4.14": 6.4.6
