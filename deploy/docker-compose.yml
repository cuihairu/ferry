services:
  ferry-server:
    build:
      context: ..
      dockerfile: deploy/ferry-server.Dockerfile
    restart: unless-stopped
    environment:
      FERRY_ADDR: ":8080"
      FERRY_DB_DRIVER: ${FERRY_DB_DRIVER:-sqlite}
      FERRY_DB_DSN: ${FERRY_DB_DSN:-/data/ferry.db}
      FERRY_BASE_URL: ${FERRY_BASE_URL:-http://localhost:8080}
      # The backup directory defaults to the data volume (survives container recreation; overridden by env).
      FERRY_BACKUP_DIR: ${FERRY_BACKUP_DIR:-/data/backups}
      # --env-file only performs ${...} substitution; it does not auto-inject into containers: every
      # deployment item documented in ferry.env.example must be passed through here one by one,
      # otherwise the setting is silently ignored. An empty string has the same effect as unset (the config side only accepts non-empty values).
      FERRY_SECRET_KEY: ${FERRY_SECRET_KEY:-}
      # FERRY_ENV/FERRY_KEYFILE are equally documented deployment items; missing them is silently ignored
      # (the compose-smoke postgres leg hit this): writing FERRY_ENV=production
      # for the key gate, and FERRY_KEYFILE key persistence, do not take effect in container deployments.
      FERRY_ENV: ${FERRY_ENV:-}
      FERRY_KEYFILE: ${FERRY_KEYFILE:-}
      # After the Caddy reverse proxy the health loopback exemption looks at ClientIP: when the proxy is not
      # trusted, ClientIP is the proxy's container IP, so compose deployments' health/rate-limit criterion must
      # trust the proxy on the intranet segment (same as ferry.env.example's "trusted proxy allowlist" section; env can override).
      FERRY_TRUSTED_PROXIES: ${FERRY_TRUSTED_PROXIES:-172.16.0.0/12}
      FERRY_ADMIN_USER: ${FERRY_ADMIN_USER:-}
      FERRY_ADMIN_PASSWORD: ${FERRY_ADMIN_PASSWORD:-}
      FERRY_ADMIN_SECRET: ${FERRY_ADMIN_SECRET:-}
      FERRY_API_SECRET: ${FERRY_API_SECRET:-}
      FERRY_BOT_TOKEN: ${FERRY_BOT_TOKEN:-}
      FERRY_HERALD_URL: ${FERRY_HERALD_URL:-}
      FERRY_HERALD_TOKEN: ${FERRY_HERALD_TOKEN:-}
      FERRY_HERALD_CALLBACK_SECRET: ${FERRY_HERALD_CALLBACK_SECRET:-}
      FERRY_AGENT_BASE: ${FERRY_AGENT_BASE:-}
      FERRY_AGENT_VERSION: ${FERRY_AGENT_VERSION:-}
      FERRY_TOFU_BIN: ${FERRY_TOFU_BIN:-}
      FERRY_TOFU_DIR: ${FERRY_TOFU_DIR:-}
      FERRY_RECOVERY_SEC: ${FERRY_RECOVERY_SEC:-}
      FERRY_RECOVERY_TEMPLATE_ID: ${FERRY_RECOVERY_TEMPLATE_ID:-}
      FERRY_REPLENISH_SEC: ${FERRY_REPLENISH_SEC:-}
      FERRY_POOL_TEMPLATE_ID: ${FERRY_POOL_TEMPLATE_ID:-}
      FERRY_ACME_BIN: ${FERRY_ACME_BIN:-}
      FERRY_ACME_HOME: ${FERRY_ACME_HOME:-}
      FERRY_ACME_WEBROOT: ${FERRY_ACME_WEBROOT:-}
      FERRY_CERT_SEC: ${FERRY_CERT_SEC:-}
      FERRY_BACKUP_CRON: ${FERRY_BACKUP_CRON:-}
      FERRY_BACKUP_KEEP: ${FERRY_BACKUP_KEEP:-}
      FERRY_BACKUP_S3_ENABLED: ${FERRY_BACKUP_S3_ENABLED:-}
      FERRY_BACKUP_S3_ENDPOINT: ${FERRY_BACKUP_S3_ENDPOINT:-}
      FERRY_BACKUP_S3_BUCKET: ${FERRY_BACKUP_S3_BUCKET:-}
      FERRY_BACKUP_S3_ACCESS_KEY: ${FERRY_BACKUP_S3_ACCESS_KEY:-}
      FERRY_BACKUP_S3_SECRET_KEY: ${FERRY_BACKUP_S3_SECRET_KEY:-}
      # External support (servify embed, optional): any one empty = the support entry is disabled.
      FERRY_SUPPORT_URL: ${FERRY_SUPPORT_URL:-}
      FERRY_SUPPORT_SERVICE_KEY: ${FERRY_SUPPORT_SERVICE_KEY:-}
      # Master/standby replication (standby): the master panel enables TOKEN; the standby instance sets MASTER_URL pointing at the master panel.
      FERRY_STANDBY_TOKEN: ${FERRY_STANDBY_TOKEN:-}
      FERRY_STANDBY_MASTER_URL: ${FERRY_STANDBY_MASTER_URL:-}
      FERRY_STANDBY_SEC: ${FERRY_STANDBY_SEC:-}
      # Scheduling-interval knobs, one per item in ferry.env.example's "scheduling-interval knobs" section.
      FERRY_HEARTBEAT_SEC: ${FERRY_HEARTBEAT_SEC:-}
      FERRY_MONITOR_SEC: ${FERRY_MONITOR_SEC:-}
      FERRY_EVENT_FLUSH_SEC: ${FERRY_EVENT_FLUSH_SEC:-}
      FERRY_REVIEW_SEC: ${FERRY_REVIEW_SEC:-}
      FERRY_POOL_SEC: ${FERRY_POOL_SEC:-}
      FERRY_ALLOC_SEC: ${FERRY_ALLOC_SEC:-}
      FERRY_QUOTA_LINK_SEC: ${FERRY_QUOTA_LINK_SEC:-}
      FERRY_SAVE_STATS_SEC: ${FERRY_SAVE_STATS_SEC:-}
      FERRY_NOTIFY_SCAN_SEC: ${FERRY_NOTIFY_SCAN_SEC:-}
      FERRY_PRICE_WATCH_SEC: ${FERRY_PRICE_WATCH_SEC:-}
      FERRY_TOUCH_SEC: ${FERRY_TOUCH_SEC:-}
      FERRY_TOUCH_DOMAINS_DAYS: ${FERRY_TOUCH_DOMAINS_DAYS:-}
      FERRY_COST_SEC: ${FERRY_COST_SEC:-}
      FERRY_AUDIT_RETENTION_DAYS: ${FERRY_AUDIT_RETENTION_DAYS:-}
    volumes:
      - ferry-data:/data
    # Three-state criterion for /api/health: both ok and degraded return 200 (degraded is an application-layer
    # detail reported by the checks, not a container-liveness failure); only a non-200 or timeout counts as unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ferry-dash:
    build:
      context: ..
      dockerfile: deploy/ferry-dash.Dockerfile
    restart: unless-stopped
    depends_on:
      - ferry-server
    ports:
      - "${FERRY_HTTP_PORT:-8080}:80"

  # User panel (self-service subscription / traffic lookup, Vue 3): structured the same way as ferry-dash —
  # pnpm builds the static artifacts + Caddy hosts them and reverse-proxies the backend. Previously compose
  # only shipped dash, leaving the user side with no entry point in a container deployment; the panel/
  # directory was built in the repo (make build-panel), but no compose service ever COPY'd its dist in.
  ferry-panel:
    build:
      context: ..
      dockerfile: deploy/ferry-panel.Dockerfile
    restart: unless-stopped
    depends_on:
      - ferry-server
    ports:
      - "${FERRY_PANEL_PORT:-8081}:80"

  # Switch to postgres storage: docker compose --env-file ferry.env --profile postgres up -d
  # Note that --profile is a compose global flag and must precede the subcommand (after up it raises unknown flag).
  # down needs it too: without --profile postgres is not in the service list, so the container and the ferry-pg
  # volume are left behind entirely (--remove-orphans only clears other projects' containers, not this project's
  # unlisted service).
  # Also, with postgres storage keyinit cannot infer where the key file lives, so env must set
  # FERRY_KEYFILE=/data/ferry-keys.env (or the three explicit keys), otherwise the key is replaced on every
  # restart and encrypted backups can no longer be decrypted after a restart.
  ferry-postgres:
    image: postgres:15-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      # FERRY_PG_PASSWORD must be set in env before enabling this profile (the container refuses to start if it is empty)
      POSTGRES_PASSWORD: ${FERRY_PG_PASSWORD:-}
      # Aligned with the documented DSN: ferry.env.example's DSN uses user=ferry, and without this item postgres
      # would only create the default user postgres, which the DSN cannot connect to.
      POSTGRES_USER: ${FERRY_PG_USER:-ferry}
      POSTGRES_DB: ferry
    volumes:
      - ferry-pg:/var/lib/postgresql/data

volumes:
  ferry-data:
  ferry-pg:
