services:
  ferry-server:
    build:
      context: ..
      dockerfile: deploy/ferry-server.Dockerfile
    restart: unless-stopped
    environment:
      FERRY_ADDR: ":8080"
      FERRY_DB_DRIVER: ${FERRY_DB_DRIVER:-sqlite}
      FERRY_DB_DSN: ${FERRY_DB_DSN:-/data/ferry.db}
      FERRY_BASE_URL: ${FERRY_BASE_URL:-http://localhost:8080}
      # 备份目录缺省落数据卷（容器重建不丢档；env 指定则覆盖）。
      FERRY_BACKUP_DIR: ${FERRY_BACKUP_DIR:-/data/backups}
      # --env-file 只做 ${...} 替换不自动注入容器：ferry.env.example 里
      # 记载的部署项必须在此逐一透传，否则设置即被静默忽略。
      # 空串与未设同效（config 侧只认非空值）。
      FERRY_SECRET_KEY: ${FERRY_SECRET_KEY:-}
      # FERRY_ENV/FERRY_KEYFILE 同为记载部署项，漏透传即被静默忽略
      # （compose-smoke 的 postgres 腿踩过）：env 里写 FERRY_ENV=production 的
      # 密钥门禁、FERRY_KEYFILE 的密钥持久化在容器部署里都不生效。
      FERRY_ENV: ${FERRY_ENV:-}
      FERRY_KEYFILE: ${FERRY_KEYFILE:-}
      FERRY_ADMIN_USER: ${FERRY_ADMIN_USER:-}
      FERRY_ADMIN_PASSWORD: ${FERRY_ADMIN_PASSWORD:-}
      FERRY_ADMIN_SECRET: ${FERRY_ADMIN_SECRET:-}
      FERRY_API_SECRET: ${FERRY_API_SECRET:-}
      FERRY_BOT_TOKEN: ${FERRY_BOT_TOKEN:-}
      FERRY_HERALD_URL: ${FERRY_HERALD_URL:-}
      FERRY_HERALD_TOKEN: ${FERRY_HERALD_TOKEN:-}
      FERRY_HERALD_CALLBACK_SECRET: ${FERRY_HERALD_CALLBACK_SECRET:-}
      FERRY_AGENT_BASE: ${FERRY_AGENT_BASE:-}
      FERRY_AGENT_VERSION: ${FERRY_AGENT_VERSION:-}
      FERRY_TOFU_BIN: ${FERRY_TOFU_BIN:-}
      FERRY_TOFU_DIR: ${FERRY_TOFU_DIR:-}
      FERRY_RECOVERY_SEC: ${FERRY_RECOVERY_SEC:-}
      FERRY_RECOVERY_TEMPLATE_ID: ${FERRY_RECOVERY_TEMPLATE_ID:-}
      FERRY_REPLENISH_SEC: ${FERRY_REPLENISH_SEC:-}
      FERRY_POOL_TEMPLATE_ID: ${FERRY_POOL_TEMPLATE_ID:-}
      FERRY_ACME_BIN: ${FERRY_ACME_BIN:-}
      FERRY_ACME_HOME: ${FERRY_ACME_HOME:-}
      FERRY_ACME_WEBROOT: ${FERRY_ACME_WEBROOT:-}
      FERRY_CERT_SEC: ${FERRY_CERT_SEC:-}
      FERRY_BACKUP_CRON: ${FERRY_BACKUP_CRON:-}
      FERRY_BACKUP_KEEP: ${FERRY_BACKUP_KEEP:-}
      FERRY_BACKUP_S3_ENABLED: ${FERRY_BACKUP_S3_ENABLED:-}
      FERRY_BACKUP_S3_ENDPOINT: ${FERRY_BACKUP_S3_ENDPOINT:-}
      FERRY_BACKUP_S3_BUCKET: ${FERRY_BACKUP_S3_BUCKET:-}
      FERRY_BACKUP_S3_ACCESS_KEY: ${FERRY_BACKUP_S3_ACCESS_KEY:-}
      FERRY_BACKUP_S3_SECRET_KEY: ${FERRY_BACKUP_S3_SECRET_KEY:-}
      # 外部客服（servify 嵌入，可选）：任一为空 = 客服入口关闭。
      FERRY_SUPPORT_URL: ${FERRY_SUPPORT_URL:-}
      FERRY_SUPPORT_SERVICE_KEY: ${FERRY_SUPPORT_SERVICE_KEY:-}
      # 主从同步（standby）：主面板开 TOKEN，standby 实例配 MASTER_URL 指向主面板。
      FERRY_STANDBY_TOKEN: ${FERRY_STANDBY_TOKEN:-}
      FERRY_STANDBY_MASTER_URL: ${FERRY_STANDBY_MASTER_URL:-}
      FERRY_STANDBY_SEC: ${FERRY_STANDBY_SEC:-}
      # 调度周期旋钮（ferry.env.example「调度周期旋钮」节逐一对应）。
      FERRY_HEARTBEAT_SEC: ${FERRY_HEARTBEAT_SEC:-}
      FERRY_MONITOR_SEC: ${FERRY_MONITOR_SEC:-}
      FERRY_EVENT_FLUSH_SEC: ${FERRY_EVENT_FLUSH_SEC:-}
      FERRY_REVIEW_SEC: ${FERRY_REVIEW_SEC:-}
      FERRY_POOL_SEC: ${FERRY_POOL_SEC:-}
      FERRY_ALLOC_SEC: ${FERRY_ALLOC_SEC:-}
      FERRY_QUOTA_LINK_SEC: ${FERRY_QUOTA_LINK_SEC:-}
      FERRY_SAVE_STATS_SEC: ${FERRY_SAVE_STATS_SEC:-}
      FERRY_NOTIFY_SCAN_SEC: ${FERRY_NOTIFY_SCAN_SEC:-}
      FERRY_PRICE_WATCH_SEC: ${FERRY_PRICE_WATCH_SEC:-}
      FERRY_TOUCH_SEC: ${FERRY_TOUCH_SEC:-}
      FERRY_TOUCH_DOMAINS_DAYS: ${FERRY_TOUCH_DOMAINS_DAYS:-}
      FERRY_COST_SEC: ${FERRY_COST_SEC:-}
      FERRY_AUDIT_RETENTION_DAYS: ${FERRY_AUDIT_RETENTION_DAYS:-}
    volumes:
      - ferry-data:/data
    # /api/health 三态口径：ok/degraded 都返回 200（degraded 是应用层细节，
    # 由检查项上报，不算容器存活失败）；非 200/超时才算不健康。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ferry-dash:
    build:
      context: ..
      dockerfile: deploy/ferry-dash.Dockerfile
    restart: unless-stopped
    depends_on:
      - ferry-server
    ports:
      - "${FERRY_HTTP_PORT:-8080}:80"

  # 用户面板（自助订阅/流量查询，Vue 3）：与 ferry-dash 同构——pnpm 构建静态
  # 产物 + Caddy 托管并反代后端。此前 compose 只发 dash，用户端在容器部署里
  # 没有入口；panel/ 目录虽在仓内构建（make build-panel），但 dist 从未被
  # 任何 compose 服务 COPY 进去。
  ferry-panel:
    build:
      context: ..
      dockerfile: deploy/ferry-panel.Dockerfile
    restart: unless-stopped
    depends_on:
      - ferry-server
    ports:
      - "${FERRY_PANEL_PORT:-8081}:80"

  # 切 postgres 存储：docker compose --env-file ferry.env --profile postgres up -d
  # 注意 --profile 是 compose 全局参数，必须放在子命令前（放 up 后会报 unknown flag）。
  # down 也要带：不带 --profile 时 postgres 不在服务列表内，容器与 ferry-pg 卷
  # 会整个留下（--remove-orphans 只清别的项目的容器，不管本项目的漏登服务）。
  # 且 postgres 存储下 keyinit 无从推断密钥文件位置，须在 env 设
  # FERRY_KEYFILE=/data/ferry-keys.env（或显式三钥），否则密钥每轮重启换掉、
  # 已加密的备份重启后解不开。
  ferry-postgres:
    image: postgres:15-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      # 启用本 profile 前必须在 env 设置 FERRY_PG_PASSWORD（留空时容器会拒绝启动）
      POSTGRES_PASSWORD: ${FERRY_PG_PASSWORD:-}
      # 与记载的 DSN 口径对齐：ferry.env.example 的 DSN 用 user=ferry，
      # 不设本项时 postgres 只会建默认用户 postgres，DSN 连不上。
      POSTGRES_USER: ${FERRY_PG_USER:-ferry}
      POSTGRES_DB: ferry
    volumes:
      - ferry-pg:/var/lib/postgresql/data

volumes:
  ferry-data:
  ferry-pg:
